[project]
name = "agent-z"
version = "0.2.0"
description = "企业级智能投研助手 —— 基于 LangGraph 的双模式 Agent 系统，集成自进化长期记忆"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "dashscope>=1.20",
    "faiss-cpu>=1.9",
    "numpy>=1.26",
    "browser-use>=0.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
agent-z = "api.main:app"
