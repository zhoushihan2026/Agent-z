<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">
<title>新任务唤醒记忆：定范围、按优先级取候选、生成任务上下文</title>
<defs>
  <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,4 L0,8 Z" fill="#98A2B3"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="600" y="46" font-size="28" font-weight="700" fill="#253858" text-anchor="middle">新任务唤醒记忆：不是全量塞回，是生成任务上下文</text>

<!-- step boxes horizontal -->
<rect x="60" y="110" width="240" height="96" rx="14" fill="#F5F7FA" stroke="#98A2B3" stroke-width="2"/>
<text x="180" y="148" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">新任务进来</text>
<text x="180" y="178" font-size="14" fill="#667085" text-anchor="middle">"上海两天家庭游，路线要可执行"</text>

<line x1="300" y1="158" x2="360" y2="158" stroke="#667085" stroke-width="2.5"/>
<polygon points="370,158 356,151 356,165" fill="#667085"/>

<rect x="370" y="110" width="240" height="96" rx="14" fill="#EEF4FF" stroke="#1F6FEB" stroke-width="2"/>
<text x="490" y="148" font-size="18" font-weight="700" fill="#1F6FEB" text-anchor="middle">推导 scope</text>
<text x="490" y="178" font-size="14" fill="#667085" text-anchor="middle">project / user / 任务域 / 风险等级</text>

<line x1="610" y1="158" x2="670" y2="158" stroke="#667085" stroke-width="2.5"/>
<polygon points="680,158 666,151 666,165" fill="#667085"/>

<rect x="680" y="110" width="240" height="96" rx="14" fill="#EEF4FF" stroke="#1F6FEB" stroke-width="2"/>
<text x="800" y="148" font-size="18" font-weight="700" fill="#1F6FEB" text-anchor="middle">分优先级取候选</text>
<text x="800" y="178" font-size="14" fill="#667085" text-anchor="middle">Workspace build_context</text>

<line x1="920" y1="158" x2="980" y2="158" stroke="#667085" stroke-width="2.5"/>
<polygon points="990,158 976,151 976,165" fill="#667085"/>

<rect x="990" y="110" width="160" height="96" rx="14" fill="#EDF7EE" stroke="#2E7D32" stroke-width="2"/>
<text x="1070" y="148" font-size="18" font-weight="700" fill="#2E7D32" text-anchor="middle">任务执行</text>
<text x="1070" y="178" font-size="14" fill="#667085" text-anchor="middle">带着记忆开工</text>

<!-- priority detail under step 3 -->
<rect x="330" y="280" width="540" height="180" rx="16" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
<text x="600" y="316" font-size="17" font-weight="700" fill="#253858" text-anchor="middle">候选的优先顺序</text>
<text x="366" y="352" font-size="15" fill="#101828" text-anchor="start">① semantic 规则先进 —— 少而稳定，直接变成任务约束</text>
<text x="366" y="382" font-size="15" fill="#101828" text-anchor="start">② consolidated 经验按相关性挑 —— 解释"之前为什么失败"</text>
<text x="366" y="412" font-size="15" fill="#101828" text-anchor="start">③ raw 证据只在需要时回读 —— 默认不进上下文</text>
<text x="366" y="442" font-size="14" fill="#98A2B3" text-anchor="start">每一条都带来源，可以追问"这条记忆凭什么在这里"</text>

<line x1="800" y1="206" x2="700" y2="280" stroke="#98A2B3" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow-gray)"/>

<!-- context limit note -->
<rect x="920" y="280" width="220" height="180" rx="16" fill="#FFF4E5" stroke="#B45309" stroke-width="2"/>
<text x="1030" y="316" font-size="17" font-weight="700" fill="#B45309" text-anchor="middle">上下文上限</text>
<text x="1030" y="352" font-size="14" fill="#101828" text-anchor="middle">总字符数 / 单条上限</text>
<text x="1030" y="382" font-size="14" fill="#101828" text-anchor="middle">超出上限的进 omission</text>
<text x="1030" y="412" font-size="14" fill="#667085" text-anchor="middle">明确记下"没带上什么"</text>

<text x="600" y="524" font-size="15" fill="#667085" text-anchor="middle">召回的产出是一个可审计的上下文包，不是一段越拼越长的历史记录</text>
</svg>
