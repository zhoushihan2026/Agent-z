<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">
<title>心跳整理管线：扫描、评分、分流、记录进度</title>
<defs>
  <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,4 L0,8 Z" fill="#98A2B3"/>
  </marker>
  <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1F6FEB"/>
  </marker>
  <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2E7D32"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="600" y="46" font-size="28" font-weight="700" fill="#253858" text-anchor="middle">心跳整理管线：一次心跳做四件事</text>

<!-- step 1 scan -->
<rect x="70" y="110" width="240" height="88" rx="14" fill="#F5F7FA" stroke="#98A2B3" stroke-width="2"/>
<text x="190" y="146" font-size="18" font-weight="700" fill="#344054" text-anchor="middle">1 · 扫描新记录</text>
<text x="190" y="174" font-size="14" fill="#667085" text-anchor="middle">按 checkpoint 里的已处理 id 过滤</text>

<line x1="310" y1="154" x2="380" y2="154" stroke="#667085" stroke-width="2.5"/>
<polygon points="390,154 376,147 376,161" fill="#667085"/>

<!-- step 2 score -->
<rect x="390" y="110" width="240" height="88" rx="14" fill="#EEF4FF" stroke="#1F6FEB" stroke-width="2"/>
<text x="510" y="146" font-size="18" font-weight="700" fill="#1F6FEB" text-anchor="middle">2 · 模型抽取记忆点</text>
<text x="510" y="174" font-size="14" fill="#667085" text-anchor="middle">偏好 / 事实 / 教训 + 支撑事件 id</text>

<line x1="630" y1="154" x2="700" y2="154" stroke="#667085" stroke-width="2.5"/>
<polygon points="710,154 696,147 696,161" fill="#667085"/>

<!-- step 3 route -->
<rect x="710" y="110" width="240" height="88" rx="14" fill="#EEF4FF" stroke="#1F6FEB" stroke-width="2"/>
<text x="830" y="146" font-size="18" font-weight="700" fill="#1F6FEB" text-anchor="middle">3 · 代码分流</text>
<text x="830" y="174" font-size="14" fill="#667085" text-anchor="middle">按结构化证据决定去向</text>

<!-- three outcomes -->
<rect x="160" y="286" width="280" height="96" rx="14" fill="#F5F7FA" stroke="#98A2B3" stroke-width="2"/>
<text x="300" y="322" font-size="17" font-weight="700" fill="#344054" text-anchor="middle">证据不足 → 留在 raw 层</text>
<text x="300" y="350" font-size="14" fill="#667085" text-anchor="middle">不删除，但不进召回候选</text>

<rect x="470" y="286" width="280" height="96" rx="14" fill="#EEF4FF" stroke="#1F6FEB" stroke-width="2"/>
<text x="610" y="322" font-size="17" font-weight="700" fill="#1F6FEB" text-anchor="middle">有用经验 → episode 摘要</text>
<text x="610" y="350" font-size="14" fill="#667085" text-anchor="middle">写入 consolidated，带证据链接</text>

<rect x="780" y="286" width="300" height="96" rx="14" fill="#EDF7EE" stroke="#2E7D32" stroke-width="2"/>
<text x="930" y="322" font-size="17" font-weight="700" fill="#2E7D32" text-anchor="middle">稳定 / 高风险 → 升格为规则</text>
<text x="930" y="350" font-size="14" fill="#667085" text-anchor="middle">写入 semantic，带升格理由和置信度</text>

<!-- fan-out lines -->
<line x1="790" y1="198" x2="320" y2="286" stroke="#98A2B3" stroke-width="2" marker-end="url(#arrow-gray)"/>
<line x1="830" y1="198" x2="620" y2="286" stroke="#1F6FEB" stroke-width="2" marker-end="url(#arrow-blue)"/>
<line x1="870" y1="198" x2="920" y2="286" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow-green)"/>

<!-- step 4 checkpoint -->
<rect x="300" y="452" width="600" height="96" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="2"/>
<text x="600" y="488" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">4 · checkpoint：记录已处理 id + 下一次心跳间隔</text>
<text x="600" y="516" font-size="14" fill="#667085" text-anchor="middle">新事件多 → 间隔缩短；没有新事件 → 间隔拉长。第二次心跳靠它不重复处理同一批记录</text>

<line x1="600" y1="382" x2="600" y2="442" stroke="#B45309" stroke-width="2.5"/>
<polygon points="600,452 593,438 607,438" fill="#B45309"/>

<text x="600" y="582" font-size="15" fill="#667085" text-anchor="middle">分工原则：理解自然语言的判断交给模型，可核对的结构化判断（status、次数、容量、进度）留在代码</text>
</svg>
